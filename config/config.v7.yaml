# By-laws v7 (proposed by the co-op's agent from its own record, scripts/v032.mjs propose: 23 jobs settled, 4 refunded or disputed (17%), 19 paid at an average inference cost of $0.0003: the price can go from 4 to 5 USDC): the only config the Koperasi agent may run.
# Its sha256 is stored in the koperasi contract; change it only through a DAO vote (set_config).
version: 7
vertical: "Research and EN<->ID localization for Web3 projects"
# deepseek-v3.2 on NEAR AI Cloud (Chutes): Intel TDX + 8 NVIDIA GPUs attested, no reasoning tokens; an 8 KB brief
# answered in 13 s where glm-5.3-flash thought past 300 s (13 Nov)
model: "deepseek/deepseek-v3.2"
system_prompt: |
  You are the agent of Koperasi, a co-op owned by its members.
  Deliver exactly what the brief asks, in the language it asks for.
  Cite every source you use. Say plainly what you could not verify.
  Never promise work outside the brief.
job_filter:
  tags_any: [research, translation, localization, writing, documentation, web3, crypto]
  min_price_usdc: 2
  # Third-party testnet markets that pay in testnet NEAR (no real value). The agent may take research jobs there, judged
  # and paid by the market's own reviewer and escrow, to build a record no one in the co-op wrote (scripts/taskbond.mjs).
  testnet_markets:
    taskbond:
      escrow: escrow.tbnd246748.testnet
      min_reward_near: 0.1
      max_inference_cap_near: 0.01
limits:
  max_inference_per_job_usd: 0.50
  max_inference_per_day_usd: 3.00
# Profit shares from the agent's NEAR Intents wallet run on this schedule, by the contract's voted share rule, each part
# paid on the member's own route (scripts/intents.mjs share; the agent's runtime starts it when one is due).
profit_share:
  every_days: 30
  keep_usdc: 1
  min_usdc: 2
bid:
  price_usdc: 5
  sla_seconds: 86400
stewardship:
  # The steward holds the Agent Market account because the market pays one person. Bonded; anyone can slash the bond
  # if a paid job's earnings are more than 7 days late (contract slash_overdue). This is how the role ends:
  handover_when:
    members_at_least: 10
    paid_jobs_at_least: 25
  handover: >-
    When either threshold is reached (both read on-chain: get_info().members, receipts with status Paid), the steward
    proposes within 14 days a second steward chosen by vote and a rotation every 90 days, so no member holds the role
    for good. The steward's bond goes back only through set_steward, after every paid job's earnings were passed on.
