# The co-op's agent as a Shade Agent on Phala Cloud (Intel TDX, dstack). Everything that runs is pinned here, so the
# compose hash in the attestation names exactly this: the Node image by digest, and this public repo at one commit.
# The co-op's DAO approves that hash in the TEE registry (tee-registry/) before the worker can register.
# Secrets are Phala encrypted env vars (sealed to the VM): KOP_SPONSOR_KEY, NEARAI_API_KEY.
services:
  agent:
    image: node:22-bookworm@sha256:e13726ca604184d7a91fcacab1fc09eefd642dc28e79ac34e85540dd93b78cfb
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
    environment:
      - KOP_TEE_REGISTRY=kop-tee-mwfb5bj2.testnet
      - KOP_SPONSOR_ID=kop-tee-sponsor-mwfb5bj2.testnet
      - KOP_SPONSOR_KEY=${KOP_SPONSOR_KEY}
      - NEARAI_API_KEY=${NEARAI_API_KEY}
    command: >-
      sh -c "git clone https://github.com/PugarHuda/koperasi /app && cd /app && git checkout 86cad6dd5877b3f6cb65471857d3a69debc7fb9a
      && npm ci --omit=dev --ignore-scripts && node agent/tee-worker.mjs"
    restart: "no"
