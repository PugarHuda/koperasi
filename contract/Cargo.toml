[package]
name = "koperasi"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Koperasi: an AI agent co-op owned by its members through a Sputnik DAO"
# NEP-330: shown by the contract_source_metadata view and by explorers
repository = "https://github.com/PugarHuda/koperasi"

[lib]
crate-type = ["cdylib", "rlib"]

# NEP-330 reproducible build: `cargo near build reproducible-wasm` builds in this pinned image, so anyone can rebuild
# the exact wasm from the git commit recorded in the contract (contract_source_metadata.build_info)
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
proptest = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[target.'cfg(not(windows))'.dev-dependencies]
near-sandbox = "0.3.12"
near-api = "0.8"
tokio = { version = "1", features = ["full"] }
testresult = "0.4.1"
