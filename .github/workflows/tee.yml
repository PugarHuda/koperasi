# Re-proves every day that the model in the running by-laws is served from genuine TEEs (Intel TDX + NVIDIA GPU,
# bound to a fresh nonce) and commits the evidence the web page shows. No secrets: the attestation API is public.
name: tee-attestation
on:
  schedule: [{ cron: "17 3 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Verify the by-laws model
        run: |
          MODEL=$(grep -E '^model:' "$(node -p "require('./deployment.testnet.json').configUri")" | sed -E 's/model: *"?([^"]+)"?.*/\1/' | tr -d '\r')
          node agent/tee.mjs "$MODEL"
      - name: Commit the evidence
        if: always()
        run: |
          git config user.name "koperasi-ci"
          git config user.email "koperasi-ci@users.noreply.github.com"
          git add evidence
          git diff --cached --quiet || (git commit -m "TEE evidence: daily re-check" && git push)
