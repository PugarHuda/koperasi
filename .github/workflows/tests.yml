# Every push and PR: lint, typecheck, agent unit tests, contract tests, and the page end to end in Chromium, Firefox and
# WebKit (desktop, tablet and phones) against live NEAR testnet data, from the files in web/ served locally.
# Every push and every day: `npm run verify` checks the README's claims against the chain.
# Every day: the same browser tests against the deployed page, so a broken deploy shows up as a failed run.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  schedule: [{ cron: "41 4 * * *" }]
  workflow_dispatch:
# a newer push to the same branch cancels the older run instead of spending minutes on it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  static:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      # web/verify.mjs (`npm run verify` as one file, served by the page) must be what this source builds
      - run: npm run build:verify && git diff --exit-code web/verify.mjs
      - run: npm audit --audit-level=high

  # every push and every day: the README's claims about the showcase co-op, read from testnet (no keys)
  chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run verify

  contract:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: contract }
      - run: cd contract && cargo test --lib

  # integration against the sponsor protocol: a local NEAR sandbox runs the real Sputnik DAO v2 code (the testnet
  # showcase DAO's own wasm) next to this contract, and a task is paid from the DAO treasury through role `tasks`
  sandbox:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: contract }
      - run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - run: cd contract && cargo near build non-reproducible-wasm --locked
      - run: cd contract && cargo test --locked --test sputnik_sandbox

  page:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name == 'schedule' && '["live"]' || '["local"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Serve web/
        if: matrix.target == 'local'
        run: npm run web:files && (cd web && python3 -m http.server 5173 >/dev/null 2>&1 &) && sleep 1
      - name: Playwright
        env:
          BASE_URL: ${{ matrix.target == 'local' && 'http://localhost:5173' || 'https://koperasi-kohl.vercel.app' }}
        # screenshots are compared on the builder's machine (tests/__screenshots__); fonts differ on Linux runners
        run: npx playwright test --grep-invert @visual
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "playwright-report-${{ matrix.target }}", path: playwright-report, retention-days: 14 }
